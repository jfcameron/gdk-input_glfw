name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GLFW_HEADERS: libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxkbcommon-dev libwayland-dev wayland-protocols

jobs:
  linux:
    name: linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc 11,         runner: ubuntu-22.04, preset: linux-gcc,   packages: g++-11,   cxx: g++-11 }
          - { name: gcc 12,         runner: ubuntu-24.04, preset: linux-gcc,   packages: g++-12,   cxx: g++-12 }
          - { name: gcc 13,         runner: ubuntu-24.04, preset: linux-gcc,   packages: g++-13,   cxx: g++-13 }
          - { name: gcc 14,         runner: ubuntu-24.04, preset: linux-gcc,   packages: g++-14,   cxx: g++-14 }
          - { name: clang 14,       runner: ubuntu-22.04, preset: linux-clang, packages: clang-14, cxx: clang++-14 }
          - { name: clang 15,       runner: ubuntu-22.04, preset: linux-clang, packages: clang-15, cxx: clang++-15 }
          - { name: clang 16,       runner: ubuntu-24.04, preset: linux-clang, packages: clang-16, cxx: clang++-16 }
          - { name: clang 17,       runner: ubuntu-24.04, preset: linux-clang, packages: clang-17, cxx: clang++-17 }
          - { name: clang 18,       runner: ubuntu-24.04, preset: linux-clang, packages: clang-18, cxx: clang++-18 }
          - { name: clang latest,   runner: ubuntu-24.04, preset: linux-clang, llvm: latest }
          - { name: clang libc++,   runner: ubuntu-24.04, preset: linux-clang-libcxx, packages: clang-18 libc++-18-dev libc++abi-18-dev, cxx: clang++-18 }

          - { name: gcc warnings are errors,   runner: ubuntu-24.04, preset: linux-gcc-ci }
          - { name: clang warnings are errors, runner: ubuntu-24.04, preset: linux-clang-ci }
          - { name: clang asan ubsan,          runner: ubuntu-24.04, preset: linux-clang-asan-ubsan }

          - { name: gcc arm64,      runner: ubuntu-24.04-arm, preset: linux-gcc }
          - { name: clang arm64,    runner: ubuntu-24.04-arm, preset: linux-clang }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install
        run: sudo apt-get update && sudo apt-get install -y ninja-build $GLFW_HEADERS ${{ matrix.packages }}

      - name: install the latest clang
        if: matrix.llvm == 'latest'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh
          echo "CXX_COMPILER=$(ls /usr/bin/clang++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: configure
        run: |
          compiler="${CXX_COMPILER:-${{ matrix.cxx }}}"
          cmake --preset ${{ matrix.preset }} ${compiler:+"-DCMAKE_CXX_COMPILER=$compiler"}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  interface-latest:
    name: linux gcc, against the interface's latest commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: take the interface's latest commit
        run: |
          git -C extern/gdk-input fetch origin HEAD
          git -C extern/gdk-input checkout --detach FETCH_HEAD
          git -C extern/gdk-input submodule update --init --recursive
          git -C extern/gdk-input log -1 --oneline

      - name: install
        run: sudo apt-get update && sudo apt-get install -y ninja-build $GLFW_HEADERS

      - name: configure
        run: cmake --preset linux-gcc

      - name: build
        run: cmake --build --preset linux-gcc

      - name: test
        run: ctest --preset linux-gcc

  linux-containers:
    name: linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc latest
            image: 'gcc:latest'
            install: >-
              apt-get update && apt-get install -y git cmake ninja-build
              libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxkbcommon-dev libwayland-dev wayland-protocols
          - name: musl alpine
            image: 'alpine:latest'
            install: >-
              apk add --no-cache git g++ cmake samurai
              libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxkbcommon-dev wayland-dev wayland-protocols

    steps:
      - name: install
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset linux-gcc

      - name: build
        run: cmake --build --preset linux-gcc

      - name: test
        run: ctest --preset linux-gcc

  macos:
    name: macos ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: apple clang arm64,  runner: macos-15 }
          - { name: apple clang x86_64, runner: macos-15-intel }
          - { name: apple clang older,  runner: macos-14 }
          - { name: gcc arm64,          runner: macos-15, gcc: true }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: use Homebrew's gcc
        if: matrix.gcc
        run: |
          brew install gcc
          echo "CXX=$(ls "$(brew --prefix gcc)"/bin/g++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: configure
        run: cmake --preset macos-clang

      - name: build
        run: cmake --build --preset macos-clang

      - name: test
        run: ctest --preset macos-clang

  windows:
    name: windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc x64 (2022),            runner: windows-2022,  preset: windows-msvc }
          - { name: msvc x64,                   runner: windows-2025,  preset: windows-msvc }
          - { name: msvc warnings are errors,   runner: windows-2025,  preset: windows-msvc-ci }
          - { name: msvc x86,                   runner: windows-2025,  preset: windows-msvc-x86 }
          - { name: msvc arm64,                 runner: windows-11-arm, preset: windows-msvc-arm64 }
          - { name: clang-cl x64,               runner: windows-2025,  preset: windows-clang-cl }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  mingw:
    name: windows mingw ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc x64,   msystem: UCRT64,  cc: gcc,   cxx: g++ }
          - { name: clang x64, msystem: CLANG64, cc: clang, cxx: clang++ }

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          pacboy: toolchain:p cmake:p ninja:p

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset windows-mingw -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: build
        run: cmake --build --preset windows-mingw

      - name: test
        run: ctest --preset windows-mingw

  emscripten:
    name: emscripten (the library and demos; the tests need GLFW's null platform)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: configure
        run: emcmake cmake --preset emscripten

      - name: build
        run: cmake --build --preset emscripten

  freebsd:
    name: freebsd clang
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y cmake ninja libX11 libXcursor libXi libXinerama libXrandr libxkbcommon
          run: |
            cmake --preset freebsd-clang
            cmake --build --preset freebsd-clang
            ctest --preset freebsd-clang

  standards:
    name: headers standalone (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [c++20, c++23, c++2c]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: every header compiles alone, warnings are errors
        run: |
          for header in glfw_context; do
            printf '#include <gdk/input/%s.h>\nint main(){}\n' "$header" > "${header}_alone.cpp"
            ${{ matrix.compiler }} -std=${{ matrix.std }} -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wdeprecated -Werror \
                -Iinclude -Iextern/gdk-input/include -c "${header}_alone.cpp" -o /dev/null
          done

  documentation:
    name: doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install doxygen, graphviz and ninja
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build

      - name: generate
        run: cmake --preset linux-docs

      - name: upload for github pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/build/linux-docs/docs

  pages:
    name: publish to github pages
    needs: documentation
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
